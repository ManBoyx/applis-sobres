# Le serveur a peu de mémoire libre : on plafonne Gradle.
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
# Applications 100 % Java : sans cette ligne, le plugin Android ajoute la
# bibliothèque Kotlin (2 Mo) dans chaque APK.
android.builtInKotlin=false
